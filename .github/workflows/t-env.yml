name: T env
on:
  pull_request:
  pull_request_target:
  workflow_run: {workflows: ["T verdict"], types: [completed]}
permissions: {contents: read}
jobs:
  env:
    runs-on: ubuntu-latest
    environment: reviewer-test
    steps:
      - env: {S: "${{ secrets.FAKE_ENV_SECRET }}"}
        run: 'echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF has-secret=$([ -n "$S" ] && echo yes || echo no)"'
